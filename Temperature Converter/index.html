<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | 100 JavaScript Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center items-center p-4 font-sans">
    <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl p-6 sm:p-8 backdrop-blur-md">
        <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 mb-6 transition-colors">
            ← Back to All Projects
        </a>

        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Temperature Converter</h1>
        <p class="text-sm text-slate-400 mb-8">Real-time synchronized converter between Celsius, Fahrenheit, and Kelvin.</p>

        <!-- Temperature Sliders & Inputs -->
        <div class="space-y-6">
            <!-- Celsius -->
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <label for="cInput" class="text-sm font-semibold text-cyan-400">Celsius (°C)</label>
                    <input type="number" id="cInput" step="any"
                        class="w-28 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-right font-mono text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
                </div>
                <input type="range" id="cSlider" min="-100" max="150" value="25" step="0.5"
                    class="w-full accent-cyan-500 cursor-pointer" />
            </div>

            <!-- Fahrenheit -->
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <label for="fInput" class="text-sm font-semibold text-amber-400">Fahrenheit (°F)</label>
                    <input type="number" id="fInput" step="any"
                        class="w-28 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-right font-mono text-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
                </div>
                <input type="range" id="fSlider" min="-148" max="302" value="77" step="0.5"
                    class="w-full accent-amber-500 cursor-pointer" />
            </div>

            <!-- Kelvin -->
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <label for="kInput" class="text-sm font-semibold text-purple-400">Kelvin (K)</label>
                    <input type="number" id="kInput" min="0" step="any"
                        class="w-28 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-right font-mono text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
                </div>
                <input type="range" id="kSlider" min="173" max="423" value="298.15" step="0.5"
                    class="w-full accent-purple-500 cursor-pointer" />
            </div>
        </div>

        <!-- Quick Reference Benchmarks -->
        <div class="mt-8 pt-6 border-t border-slate-700/80 flex flex-wrap justify-between text-xs text-slate-400 gap-2">
            <span>❄️ Freezing: 0°C / 32°F / 273.15K</span>
            <span>🌡️ Room Temp: 21°C / 69.8°F / 294.15K</span>
            <span>🔥 Boiling: 100°C / 212°F / 373.15K</span>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
