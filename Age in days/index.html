<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Age in Days | 100 JavaScript Projects</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 py-10 flex flex-col justify-center items-center px-4 font-sans">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 backdrop-blur-sm">
        <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 mb-6 transition-colors">
            ← Back to All Projects
        </a>

        <h1 class="text-2xl font-bold text-white mb-2">Age in Days Calculator</h1>
        <p class="text-sm text-slate-400 mb-6">Enter your birth year to compute the exact number of days you've been exploring the universe.</p>

        <div class="flex flex-col sm:flex-row gap-3">
            <input type="number" id="age" min="1900" max="2099" placeholder="e.g. 1995"
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition" />
            <button class="px-6 py-3 font-semibold rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg transition active:scale-95" id="calculator">
                Calculate
            </button>
        </div>

        <div id="result" class="min-h-[3rem] flex items-center justify-center">
            <h2 id="ageInDays" class="text-center"></h2>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
