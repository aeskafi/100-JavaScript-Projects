<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>Modern Calculator | 100 JavaScript Projects</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center items-center p-4 font-sans">
    <div class="w-full max-w-sm bg-slate-800/90 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden backdrop-blur-md">
        <div class="p-4 pb-2">
            <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">
                ← Back to All Projects
            </a>
        </div>

        <div class="px-6 py-4 flex flex-col justify-end items-end min-h-[120px] bg-slate-950/70 border-b border-slate-700/80">
            <div id="equation" class="text-sm font-mono text-slate-400 min-h-[1.25rem] truncate max-w-full"></div>
            <div id="result" class="text-5xl font-mono font-light text-white tracking-wider truncate max-w-full">0</div>
        </div>

        <div id="operatorContainer" class="grid grid-cols-4 gap-2 p-4 bg-slate-800">
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
