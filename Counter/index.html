<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Interactive Counter | 100 JavaScript Projects</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 py-10 flex flex-col justify-center items-center px-4 font-sans">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 backdrop-blur-sm text-center">
        <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 mb-6 transition-colors">
            ← Back to All Projects
        </a>

        <h1 class="text-2xl font-bold text-white mb-2">Interactive Counter</h1>
        <p class="text-sm text-slate-400 mb-8">Simple state-driven counter with keyboard shortcut support (+, -, 0).</p>

        <div class="flex items-center justify-center gap-4 mb-6">
            <button id="decrement"
                class="w-14 h-14 text-2xl font-bold rounded-2xl bg-slate-700 hover:bg-slate-600 text-slate-200 shadow-md transition active:scale-95 flex items-center justify-center">
                -
            </button>
            <div id="number" class="w-40 py-3 bg-slate-950 border border-slate-700 rounded-2xl text-4xl font-extrabold text-cyan-400 font-mono shadow-inner">
                0
            </div>
            <button id="increment"
                class="w-14 h-14 text-2xl font-bold rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-white shadow-md transition active:scale-95 flex items-center justify-center">
                +
            </button>
        </div>

        <button id="reset"
            class="px-6 py-2.5 font-semibold text-sm rounded-xl bg-slate-700/60 hover:bg-amber-600 text-slate-300 hover:text-white transition shadow">
            Reset Counter
        </button>
    </div>
</body>
<script src="script.js"></script>

</html>
