<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Countdown Timer | 100 JavaScript Projects</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center items-center p-4 font-mono">
    <div class="w-full max-w-xl flex flex-col items-center">
        <div class="w-full flex justify-start mb-6">
            <a href="../index.html" class="inline-flex items-center text-xs font-semibold font-sans text-cyan-400 hover:text-cyan-300 transition-colors">
                ← Back to All Projects
            </a>
        </div>

        <h1 class="text-3xl font-extrabold text-white text-center mb-2 tracking-wide font-sans">Countdown Timer</h1>
        <p id="targetLabel" class="text-sm text-cyan-400 text-center mb-8 font-sans">Counting down to target date...</p>

        <!-- Countdown Display Cards -->
        <div class="w-full grid grid-cols-4 gap-3 sm:gap-4 mb-8">
            <div class="flex flex-col items-center bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl">
                <span id="day" class="text-4xl sm:text-6xl font-black text-cyan-400">00</span>
                <span class="text-xs uppercase tracking-wider text-slate-400 font-sans mt-2">Days</span>
            </div>
            <div class="flex flex-col items-center bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl">
                <span id="hour" class="text-4xl sm:text-6xl font-black text-cyan-400">00</span>
                <span class="text-xs uppercase tracking-wider text-slate-400 font-sans mt-2">Hours</span>
            </div>
            <div class="flex flex-col items-center bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl">
                <span id="minutes" class="text-4xl sm:text-6xl font-black text-cyan-400">00</span>
                <span class="text-xs uppercase tracking-wider text-slate-400 font-sans mt-2">Minutes</span>
            </div>
            <div class="flex flex-col items-center bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl">
                <span id="second" class="text-4xl sm:text-6xl font-black text-amber-400">00</span>
                <span class="text-xs uppercase tracking-wider text-slate-400 font-sans mt-2">Seconds</span>
            </div>
        </div>

        <!-- Custom Date Picker -->
        <div class="w-full max-w-md bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col sm:flex-row items-center gap-3 font-sans">
            <label for="customDate" class="text-xs font-semibold text-slate-300 whitespace-nowrap">Change Target:</label>
            <input type="datetime-local" id="customDate"
                class="flex-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
            <button id="setCustomDate"
                class="w-full sm:w-auto px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl transition shadow active:scale-95">
                Set
            </button>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
