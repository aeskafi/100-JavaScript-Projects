<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Word & Text Analytics | 100 JavaScript Projects</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center items-center p-4 font-sans">
    <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl p-6 sm:p-8 backdrop-blur-md">
        <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 mb-6 transition-colors">
            ← Back to All Projects
        </a>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-2">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white">Word & Text Counter</h1>
                <p class="text-sm text-slate-400">Live statistics, character breakdown, and estimated reading time.</p>
            </div>
            <button id="clearBtn"
                class="self-start sm:self-auto px-4 py-1.5 text-xs font-semibold rounded-xl bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white transition shadow active:scale-95">
                Clear Text
            </button>
        </div>

        <div class="mb-6">
            <textarea id="text" rows="7" placeholder="Type or paste your content here to analyze..."
                class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 font-mono text-sm resize-y transition"></textarea>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">Words</span>
                <p id="words" class="text-2xl sm:text-3xl font-bold text-cyan-400 mt-1 font-mono">0</p>
            </div>
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">Characters</span>
                <p id="chars" class="text-2xl sm:text-3xl font-bold text-cyan-400 mt-1 font-mono">0</p>
            </div>
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">Sentences</span>
                <p id="sentences" class="text-2xl sm:text-3xl font-bold text-cyan-400 mt-1 font-mono">0</p>
            </div>
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">Paragraphs</span>
                <p id="paragraphs" class="text-2xl sm:text-3xl font-bold text-emerald-400 mt-1 font-mono">0</p>
            </div>
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">Reading Time</span>
                <p id="readingTime" class="text-2xl sm:text-3xl font-bold text-amber-400 mt-1 font-mono">0m</p>
            </div>
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4">
                <span class="text-xs uppercase font-medium text-slate-400">UTF-8 Size</span>
                <p id="byteSize" class="text-2xl sm:text-3xl font-bold text-purple-400 mt-1 font-mono">0 B</p>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
